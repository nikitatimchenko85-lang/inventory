<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Инвентарь">
    <meta name="theme-color" content="#F9F9F9">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <title>Инвентаризация</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-red: #FF3B30;
            --ios-green: #34C759;
            --ios-gray: #8E8E93;
            --ios-gray2: #C7C7CC;
            --ios-gray3: #E5E5EA;
            --ios-bg: #F2F2F7;
            --ios-card: #FFFFFF;
            --ios-label: #000000;
            --ios-label2: #3C3C43;
            --ios-separator: rgba(60,60,67,0.29);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--ios-bg);
            color: var(--ios-label);
            font-size: 17px;
            line-height: 1.35;
            padding-bottom: 40px;
            -webkit-font-smoothing: antialiased;
        }

        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(249,249,249,0.94);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid var(--ios-separator);
            padding: 12px 16px calc(12px);
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
        }

        .chips {
            display: flex;
            gap: 10px;
        }

        .chip {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            padding: 9px 14px;
            border: none;
            border-radius: 12px;
            background: rgba(120,120,128,0.12);
            font-family: inherit;
            text-align: left;
            cursor: pointer;
        }

        .chip:active { opacity: 0.55; }

        .chip-label {
            font-size: 11px;
            color: var(--ios-gray);
            letter-spacing: 0.02em;
        }

        .chip-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--ios-label);
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .content {
            padding: 4px 16px 0;
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: var(--ios-card);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 16px;
        }

        .row {
            display: flex;
            align-items: center;
            min-height: 44px;
            padding: 11px 16px;
            position: relative;
        }

        .row + .row::before {
            content: '';
            position: absolute;
            top: 0;
            left: 16px;
            right: 0;
            height: 0.5px;
            background: var(--ios-separator);
        }

        .row label {
            flex: 0 1 auto;
            font-size: 17px;
            color: var(--ios-label);
            white-space: nowrap;
            margin-right: 14px;
        }

        .row input,
        .row textarea {
            flex: 1 1 auto;
            min-width: 0;           /* иначе длинное слово растягивает поле за край */
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 17px;
            color: var(--ios-label);
            background: transparent;
            text-align: right;
            padding: 0;
        }

        .row textarea {
            text-align: left;
            resize: none;
            min-height: 66px;
            padding-top: 2px;
        }

        .row.stacked {
            flex-direction: column;
            align-items: stretch;
        }

        .row.stacked label {
            flex: none;
            margin-right: 0;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--ios-gray);
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--ios-gray2);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 50px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn:active { opacity: 0.6; }

        .btn-filled {
            background: var(--ios-blue);
            color: #fff;
        }

        .btn-tinted {
            background: rgba(0,122,255,0.1);
            color: var(--ios-blue);
        }

        .btn-plain {
            background: transparent;
            color: var(--ios-blue);
            font-weight: 400;
        }

        .btn-destructive {
            background: transparent;
            color: var(--ios-red);
            font-weight: 400;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        /* Фото */
        .photo-area {
            padding: 16px;
        }

        .photo-strip {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .photo-thumb {
            position: relative;
            width: 78px;
            height: 78px;
            border-radius: 10px;
            overflow: hidden;
            background: var(--ios-gray3);
        }

        .photo-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-thumb .remove {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 15px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .photo-empty {
            width: 78px;
            height: 78px;
            padding: 0;
            border-radius: 10px;
            border: 1.5px dashed var(--ios-gray2);
            background: transparent;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ios-blue);
            font-size: 30px;
            font-weight: 300;
            line-height: 1;
            cursor: pointer;
        }

        .photo-empty:active { background: rgba(0,122,255,0.08); }

        /* Список товаров */
        .item-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            position: relative;
        }

        .item-row + .item-row::before {
            content: '';
            position: absolute;
            top: 0;
            left: 16px;
            right: 0;
            height: 0.5px;
            background: var(--ios-separator);
        }

        .item-photos {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .item-photos img {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            object-fit: cover;
        }

        .item-nophoto {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            background: var(--ios-gray3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ios-gray);
        }

        .item-nophoto svg {
            width: 24px;
            height: 24px;
            display: block;
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-size: 17px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-meta {
            font-size: 15px;
            color: var(--ios-gray);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .item-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 10px;
            background: var(--ios-bg);
            color: var(--ios-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            display: block;
        }

        .icon-btn.destructive { color: var(--ios-red); }

        .icon-btn:active { opacity: 0.5; }

        .empty {
            background: var(--ios-card);
            border-radius: 10px;
            padding: 44px 20px;
            text-align: center;
            color: var(--ios-gray);
            font-size: 15px;
        }

        #tableSection {
            margin-top: 28px;
        }

        .list-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 16px 0;
        }

        .footer-note {
            font-size: 13px;
            color: var(--ios-gray);
        }

        .clear-btn {
            border: none;
            background: none;
            padding: 4px 0;
            font-family: inherit;
            font-size: 13px;
            color: var(--ios-blue);
            cursor: pointer;
        }

        .clear-btn:active { opacity: 0.5; }

        /* Камера */
        #cameraModal {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
        }

        #cameraModal.active { display: block; }

        #video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cam-close {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            justify-self: start;
        }

        .cam-close:active { background: rgba(0,0,0,0.6); }

        .cam-close svg { display: block; }

        .cam-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px 22px calc(96px + env(safe-area-inset-bottom, 0px));
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            z-index: 20;
        }

        .shutter {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: transparent;
            border: 4px solid #fff;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shutter::after {
            content: '';
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.1s;
        }

        .shutter:active::after { transform: scale(0.88); }

        .cam-gallery {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            justify-self: end;
        }

        .cam-gallery:active { background: rgba(0,0,0,0.6); }

        .cam-gallery svg {
            width: 24px;
            height: 24px;
            display: block;
        }

        .cam-counter {
            position: absolute;
            top: calc(16px + env(safe-area-inset-top, 0px));
            right: 16px;
            display: flex;
            gap: 6px;
            z-index: 22;
        }

        .cam-counter img {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            border: 1.5px solid rgba(255,255,255,0.85);
        }

        .cam-hint {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(196px + env(safe-area-inset-bottom, 0px));
            text-align: center;
            color: #fff;
            font-size: 14px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            z-index: 20;
        }

        .flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 15;
        }

        .flash.fire {
            animation: flashAnim 0.25s ease-out;
        }

        @keyframes flashAnim {
            0% { opacity: 0.9; }
            100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="chips">
            <button type="button" class="chip" id="operatorBtn">
                <span class="chip-label">Оператор</span>
                <span class="chip-value" id="operatorName">—</span>
            </button>
            <button type="button" class="chip" id="warehouseBtn">
                <span class="chip-label">Склад</span>
                <span class="chip-value" id="warehouseName">—</span>
            </button>
        </div>
    </div>

    <div class="content">
        <form id="inventoryForm">
            <div class="card">
                <div class="photo-area">
                    <div class="photo-strip" id="photoStrip"></div>
                    <input type="file" id="fileInput" accept="image/*" hidden>
                </div>
            </div>

            <div class="card">
                <div class="row">
                    <label for="name">Наименование</label>
                    <input type="text" id="name" placeholder="Обязательно" required>
                </div>
                <div class="row">
                    <label for="quantity">Количество</label>
                    <input type="number" id="quantity" placeholder="0" min="0" inputmode="numeric" required>
                </div>
                <div class="row stacked">
                    <label for="notes">Примечание</label>
                    <textarea id="notes" placeholder="Необязательно"></textarea>
                </div>
            </div>

            <div class="btn-row">
                <button type="submit" class="btn btn-filled" id="submitBtn">Добавить</button>
                <button type="button" class="btn btn-tinted" id="cancelBtn" style="display:none;">Отмена</button>
            </div>
        </form>

        <div id="tableSection"></div>
        <div class="list-footer">
            <span id="counter" class="footer-note"></span>
            <button type="button" class="clear-btn" id="clearBtn" style="display:none;">Очистить список</button>
        </div>

    </div>

    <div id="cameraModal">
        <video id="video" playsinline muted></video>
        <div class="flash" id="flash"></div>
        <div class="cam-hint" id="camHint"></div>
        <div class="cam-bar">
            <button type="button" class="cam-close" onclick="closeCameraModal()" aria-label="Закрыть">
                <svg width="20" height="20" viewBox="0 0 19 19" fill="none">
                    <path d="M2 2L17 17M17 2L2 17" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
            </button>
            <button type="button" class="shutter" id="captureBtn" aria-label="Сделать фото"></button>
            <button type="button" class="cam-gallery" id="camGalleryBtn" aria-label="Выбрать из галереи">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="3.2" y="5.2" width="17.6" height="13.6" rx="2.4" stroke="#fff" stroke-width="1.7"/>
                    <path d="M3.6 15.4 8.5 11a1.7 1.7 0 0 1 2.3 0l4 3.7m-1.2-1.1 1.9-1.7a1.7 1.7 0 0 1 2.3 0l2.6 2.4"
                          stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="9" cy="9.4" r="1.4" fill="#fff"/>
                </svg>
            </button>
        </div>
        <div class="cam-counter" id="camCounter"></div>
        <canvas id="canvas" hidden></canvas>
    </div>

    <script>
        let items = [];
        let editingId = null;
        let photoData = '';
        let photoData2 = '';
        let videoStream = null;
        let operator = '';
        let photosDirty = false;
        let warehouse = '';
        let accessKey = '';
        const MAX_LOCAL_ITEMS = 30;   // сколько последних записей держим в телефоне
        const GOOGLE_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwZmMCxv7ujqEkE_3N0ODruaKWLt6qVa9MW42p9vo1n2MpREhTjSKfMM3O_5XZlxYx-/exec';

        function saveItems() {
            try {
                localStorage.setItem('inventoryItems', JSON.stringify(items));
            } catch (e) {
                // память кончилась — освобождаем место за счёт самых старых записей
                while (items.length > 5) {
                    items = items.slice(-Math.ceil(items.length / 2));
                    try {
                        localStorage.setItem('inventoryItems', JSON.stringify(items));
                        renderTable();
                        return;
                    } catch (e2) { /* пробуем ещё раз */ }
                }
                alert('Не удалось сохранить список в памяти телефона. Записи уже отправлены в таблицу.');
            }
        }

        function loadItems() {
            const saved = localStorage.getItem('inventoryItems');
            items = saved ? JSON.parse(saved) : [];
            if (items.length > MAX_LOCAL_ITEMS) items = items.slice(-MAX_LOCAL_ITEMS);
        }

        /* ---------- Камера ---------- */

        async function openCamera() {
            if (photoData && photoData2) {
                alert('Добавлено два фото. Удалите одно, чтобы снять новое.');
                return;
            }
            document.getElementById('cameraModal').classList.add('active');
            updateCamOverlay();

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                const video = document.getElementById('video');
                video.srcObject = videoStream;
                video.onloadedmetadata = () => video.play().catch(e => console.error(e));
            } catch (err) {
                alert('Нет доступа к камере: ' + err.message);
                closeCameraModal();
            }
        }

        function updateCamOverlay() {
            const count = (photoData ? 1 : 0) + (photoData2 ? 1 : 0);
            const hint = document.getElementById('camHint');
            hint.textContent = count === 0 ? 'Фото 1 из 2' : 'Фото 2 из 2';

            const counter = document.getElementById('camCounter');
            let html = '';
            if (photoData) html += `<img src="${photoData}" alt="">`;
            if (photoData2) html += `<img src="${photoData2}" alt="">`;
            counter.innerHTML = html;
        }

        document.getElementById('captureBtn').addEventListener('click', () => {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');

            if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const photo = canvas.toDataURL('image/jpeg', 0.85);

            const flash = document.getElementById('flash');
            flash.classList.remove('fire');
            void flash.offsetWidth;
            flash.classList.add('fire');

            if (!photoData) {
                photoData = photo;
            } else {
                photoData2 = photo;
            }
            photosDirty = true;

            updatePhotoStrip();
            updateCamOverlay();

            // Оба фото сняты — закрываем камеру
            if (photoData && photoData2) {
                setTimeout(closeCameraModal, 350);
            }
        });

        function closeCameraModal() {
            document.getElementById('cameraModal').classList.remove('active');
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
            document.getElementById('video').srcObject = null;
        }

        /* ---------- Галерея ---------- */

        document.getElementById('camGalleryBtn').addEventListener('click', () => {
            closeCameraModal();
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                if (!photoData) photoData = ev.target.result;
                else photoData2 = ev.target.result;
                photosDirty = true;
                updatePhotoStrip();
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        function updatePhotoStrip() {
            const strip = document.getElementById('photoStrip');
            let html = '';
            if (photoData) {
                html += `<div class="photo-thumb"><img src="${photoData}" alt=""><button type="button" class="remove" onclick="removePhoto(1)" aria-label="Удалить фото">✕</button></div>`;
            }
            if (photoData2) {
                html += `<div class="photo-thumb"><img src="${photoData2}" alt=""><button type="button" class="remove" onclick="removePhoto(2)" aria-label="Удалить фото">✕</button></div>`;
            }
            const count = (photoData ? 1 : 0) + (photoData2 ? 1 : 0);
            for (let i = count; i < 2; i++) {
                html += `<button type="button" class="photo-empty" onclick="openCamera()" aria-label="Добавить фото">+</button>`;
            }
            strip.innerHTML = html;
        }

        function removePhoto(slot) {
            if (slot === 1) {
                photoData = photoData2 || '';
                photoData2 = '';
            } else {
                photoData2 = '';
            }
            photosDirty = true;
            updatePhotoStrip();
        }

        /* ---------- Форма ---------- */

        document.getElementById('inventoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const quantity = document.getElementById('quantity').value.trim();
            const notes = document.getElementById('notes').value.trim();

            if (!name || !quantity) {
                alert('Заполните наименование и количество');
                return;
            }

            if (!accessKey) {
                askKey(true);
                return;
            }

            if (!operator) {
                alert('Сначала укажите своё имя вверху экрана');
                askOperator(true);
                return;
            }

            if (!warehouse) {
                alert('Сначала укажите склад вверху экрана');
                askWarehouse(true);
                return;
            }

            // на Google Диск уходит полный кадр, в памяти телефона остаётся миниатюра
            const fullPhoto = photoData;
            const fullPhoto2 = photoData2;

            const item = {
                id: editingId || Date.now(),
                photo: await compressPhoto(photoData, 520, 0.6),
                photo2: await compressPhoto(photoData2, 520, 0.6),
                name,
                quantity: parseInt(quantity),
                warehouse,
                notes
            };

            const forUpload = Object.assign({}, item, {
                photo: photosDirty ? fullPhoto : '',
                photo2: photosDirty ? fullPhoto2 : ''
            });

            if (editingId) {
                items = items.map(i => i.id === editingId ? item : i);
                editingId = null;
                document.getElementById('cancelBtn').style.display = 'none';
                document.getElementById('submitBtn').textContent = 'Добавить';
                await sendToGoogleSheets(forUpload, true);
            } else {
                items.push(item);
                // в таблице записи остаются навсегда, в телефоне — только последние
                if (items.length > MAX_LOCAL_ITEMS) items = items.slice(-MAX_LOCAL_ITEMS);
                await sendToGoogleSheets(Object.assign({}, item, { photo: fullPhoto, photo2: fullPhoto2 }));
            }

            saveItems();
            resetForm();
            renderTable();
        });

        function resetForm() {
            document.getElementById('inventoryForm').reset();
            photoData = '';
            photoData2 = '';
            photosDirty = false;
            document.getElementById('fileInput').value = '';
            updatePhotoStrip();
        }

        document.getElementById('cancelBtn').addEventListener('click', () => {
            editingId = null;
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('submitBtn').textContent = 'Добавить';
            resetForm();
        });

        function editItem(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            document.getElementById('name').value = item.name;
            document.getElementById('quantity').value = item.quantity;
            document.getElementById('notes').value = item.notes;
            photoData = item.photo || '';
            photoData2 = item.photo2 || '';
            photosDirty = false;
            updatePhotoStrip();
            editingId = id;
            document.getElementById('cancelBtn').style.display = 'flex';
            document.getElementById('submitBtn').textContent = 'Сохранить';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteItem(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            if (!confirm('Удалить «' + item.name + '»?')) return;
            sendDeleteToGoogleSheets(item);
            items = items.filter(i => i.id !== id);
            saveItems();
            renderTable();
        }

        /* ---------- Google Sheets ---------- */

        function compressPhoto(base64Str, maxSide = 1080, quality = 0.8) {
            return new Promise((resolve) => {
                if (!base64Str) { resolve(''); return; }
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxSide || h > maxSide) {
                        if (w > h) { h = Math.round(h * maxSide / w); w = maxSide; }
                        else { w = Math.round(w * maxSide / h); h = maxSide; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve('');
                img.src = base64Str;
            });
        }

        async function sendToGoogleSheets(item, isEdit = false) {
            try {
                const photo = item.photo ? await compressPhoto(item.photo) : '';
                const photo2 = item.photo2 ? await compressPhoto(item.photo2) : '';

                const data = {
                    action: isEdit ? 'update' : 'add',
                    key: accessKey,
                    id: String(item.id),
                    operator: operator,
                    name: item.name,
                    quantity: item.quantity,
                    warehouse: item.warehouse,
                    notes: item.notes,
                    photo: photo,
                    photo2: photo2
                };

                fetch(GOOGLE_SHEETS_URL, { method: 'POST', body: JSON.stringify(data) })
                    .then(r => r.json())
                    .then(res => {
                        if (res.code === 'auth') keyRejected();
                        else console.log(res.status === 'success' ? '✅' : '❌', item.name);
                    })
                    .catch(err => console.error(err));
            } catch (e) {
                console.error(e);
            }
        }

        function sendDeleteToGoogleSheets(item) {
            fetch(GOOGLE_SHEETS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'delete', key: accessKey, id: String(item.id), name: item.name })
            })
                .then(r => r.json())
                .then(res => { if (res.code === 'auth') keyRejected(); })
                .catch(e => console.error(e));
        }

        /* ---------- Список ---------- */

        function renderTable() {
            const section = document.getElementById('tableSection');
            const counter = document.getElementById('counter');

            const clearBtn = document.getElementById('clearBtn');

            if (items.length === 0) {
                counter.textContent = '';
                clearBtn.style.display = 'none';
                section.innerHTML = '<div class="empty">Пока пусто. Добавьте первый товар.</div>';
                return;
            }


            let html = '<div class="card">';
            items.forEach(item => {
                let photos = '';
                if (item.photo) photos += `<img src="${item.photo}" alt="">`;
                if (item.photo2) photos += `<img src="${item.photo2}" alt="">`;
                if (!photos) photos = `<div class="item-nophoto">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M4 8.6 12 4l8 4.6v6.8L12 20l-8-4.6V8.6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M4 8.6 12 13m0 0 8-4.4M12 13v7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                </div>`;

                const meta = [item.quantity + ' шт', item.warehouse, item.notes].filter(Boolean).join(' · ');

                html += `<div class="item-row">
                    <div class="item-photos">${photos}</div>
                    <div class="item-info">
                        <div class="item-name">${escapeHtml(item.name)}</div>
                        <div class="item-meta">${escapeHtml(meta)}</div>
                    </div>
                    <div class="item-actions">
                        <button type="button" class="icon-btn" onclick="editItem(${item.id})" aria-label="Изменить">
                            <svg viewBox="0 0 22 22" fill="none" aria-hidden="true">
                                <path d="M14.6 3.9a1.9 1.9 0 0 1 2.7 0l.8.8a1.9 1.9 0 0 1 0 2.7L8.6 17H5v-3.6l9.6-9.5Z"
                                      stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        <button type="button" class="icon-btn destructive" onclick="deleteItem(${item.id})" aria-label="Удалить">
                            <svg viewBox="0 0 22 22" fill="none" aria-hidden="true">
                                <path d="M4.5 6h13M9 6V4.6h4V6M6.5 6l.7 10.4a1.4 1.4 0 0 0 1.4 1.3h4.8a1.4 1.4 0 0 0 1.4-1.3L15.5 6"
                                      stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>`;
            });
            html += '</div>';

            section.innerHTML = html;
            counter.textContent = 'В приложении: ' + items.length + ' из последних ' + MAX_LOCAL_ITEMS;
            clearBtn.style.display = 'block';
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function loadOperator() {
            operator = localStorage.getItem('inventoryOperator') || '';
            document.getElementById('operatorName').textContent = operator || 'Не задан';
        }

        function loadKey() {
            accessKey = localStorage.getItem('inventoryKey') || '';
        }

        function askKey(force) {
            const entered = prompt('Пароль доступа (спросите у ответственного за таблицу):', '');
            const clean = entered === null ? '' : entered.trim();
            if (!clean) {
                if (force) setTimeout(() => askKey(true), 150);
                return;
            }
            accessKey = clean;
            localStorage.setItem('inventoryKey', accessKey);
            if (force && !operator) setTimeout(() => askOperator(true), 200);
        }

        function keyRejected() {
            accessKey = '';
            localStorage.removeItem('inventoryKey');
            alert('Пароль не подошёл. Введите ещё раз.');
            setTimeout(() => askKey(true), 150);
        }

        function loadWarehouse() {
            warehouse = localStorage.getItem('inventoryWarehouse') || '';
            document.getElementById('warehouseName').textContent = warehouse || 'Не задан';
        }

        function askWarehouse(force) {
            const entered = prompt('Склад — он подставится в каждую запись:', warehouse);
            const clean = entered === null ? '' : entered.trim();
            if (!clean) {
                // обязательное поле: спрашиваем, пока не введут
                if (force) setTimeout(() => askWarehouse(true), 150);
                return;
            }
            warehouse = clean;
            localStorage.setItem('inventoryWarehouse', warehouse);
            document.getElementById('warehouseName').textContent = warehouse;
        }

        function askOperator(force) {
            const entered = prompt('Ваше имя — оно попадёт в таблицу рядом с каждой записью:', operator);
            const clean = entered === null ? '' : entered.trim();
            if (!clean) {
                // обязательное поле: спрашиваем, пока не введут
                if (force) setTimeout(() => askOperator(true), 150);
                return;
            }
            operator = clean;
            localStorage.setItem('inventoryOperator', operator);
            document.getElementById('operatorName').textContent = operator;
            if (force && !warehouse) setTimeout(() => askWarehouse(true), 200);
        }

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (!confirm('Очистить список на этом устройстве?\n\nЗаписи останутся в Google Таблице — исчезнут только с экрана.')) return;
            items = [];
            saveItems();
            renderTable();
        });

        document.getElementById('operatorBtn').addEventListener('click', () => askOperator(false));
        document.getElementById('warehouseBtn').addEventListener('click', () => askWarehouse(false));

        loadItems();
        loadKey();
        loadOperator();
        loadWarehouse();
        updatePhotoStrip();
        renderTable();

        // при первом запуске: пароль → имя → склад
        if (!accessKey) {
            setTimeout(() => askKey(true), 400);
        } else if (!operator) {
            setTimeout(() => askOperator(true), 400);
        } else if (!warehouse) {
            setTimeout(() => askWarehouse(true), 400);
        }
    </script>
</body>
</html>
